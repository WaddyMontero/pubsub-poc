name: Destroy GCP

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: GCP project ID
        required: true
        default: pubsub-poc-500520
      region:
        description: GCP region
        required: true
        default: europe-west1
      confirm:
        description: Type "destroy pubsub-poc-500520" to tear down the demo
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == format('destroy {0}', inputs.project_id) }}
    concurrency:
      group: gcp-deploy-${{ inputs.project_id }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Run killswitch
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          REGION: ${{ inputs.region }}
        run: ./scripts/gcp/killswitch.sh
