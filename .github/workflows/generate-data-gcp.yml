name: Generate GCP Data

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: GCP project ID
        required: true
        default: pubsub-poc-500520
      region:
        description: GCP region
        required: true
        default: europe-west1
      expected_new_records:
        description: Records expected from the currently deployed generator job
        required: true
        default: "15"

permissions:
  contents: read
  id-token: write

jobs:
  generate:
    name: Execute generator job
    runs-on: ubuntu-latest
    concurrency:
      group: gcp-deploy-${{ inputs.project_id }}
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Execute generator and verify new rows
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          REGION: ${{ inputs.region }}
          GENERATOR_COUNT: ${{ inputs.expected_new_records }}
        run: ./scripts/gcp/smoke_test.sh
